# Releases. A pushed <Addon>/vX.Y.Z[-beta.N] tag (from tools/release) runs the checks,
# packages the addon, uploads it to CurseForge and creates the GitHub Release. A manual
# run is a rehearsal: it packages any addon at any version and uploads nothing, only
# a workflow artifact to inspect.
name: release
on:
  push:
    tags: ["*/v*"]
  workflow_dispatch:
    inputs:
      addon:
        description: Addon folder name
        required: true
        default: PackFixture
      version:
        description: Version to rehearse (X.Y.Z or X.Y.Z-beta.N)
        required: true
        default: 0.0.1
      root:
        description: Folder the addon lives in
        type: choice
        options: [spec/fixtures, addons]
        default: spec/fixtures

permissions:
  contents: write # the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history, for the changelog
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('tools/versions', 'tools/bootstrap') }}
      - run: tools/bootstrap

      - name: Resolve addon and version
        id: target
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_ADDON: ${{ inputs.addon }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ROOT: ${{ inputs.root }}
        run: |
          if [ "$EVENT" = push ]; then
            addon=${REF_NAME%%/v*} version=${REF_NAME#*/v} root=addons upload=--upload
            # Only commits already on main may be released.
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
              { echo "::error::$REF_NAME is not on main"; exit 1; }
          else
            addon=$INPUT_ADDON version=$INPUT_VERSION root=$INPUT_ROOT upload=
          fi
          { echo "addon=$addon"; echo "version=$version"; echo "root=$root"; echo "upload=$upload"; } >>"$GITHUB_OUTPUT"
          echo "$EVENT: $addon $version from $root ${upload:-(rehearsal, no upload)}"

      - run: make check

      - name: Package
        env:
          ADDONS_ROOT: ${{ steps.target.outputs.root }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          ADDON: ${{ steps.target.outputs.addon }}
          VERSION: ${{ steps.target.outputs.version }}
          UPLOAD: ${{ steps.target.outputs.upload }}
        run: tools/package "$ADDON" "$VERSION" $UPLOAD

      - name: GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          ADDON: ${{ steps.target.outputs.addon }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          prerelease=()
          [[ $VERSION == *-beta.* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" .release/"$ADDON"/out/*.zip --verify-tag \
            --title "$ADDON $VERSION" --notes-file .release/"$ADDON"/out/CHANGELOG.md "${prerelease[@]}"

      - name: Keep the rehearsal package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.target.outputs.addon }}-${{ steps.target.outputs.version }}
          path: .release/${{ steps.target.outputs.addon }}/out/
